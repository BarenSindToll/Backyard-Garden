<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Permaculture plan generator — redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Garden palette — warm leaf greens + terracotta earth */
    --forest: #3d6b34;
    --forest-2: #5e9050;
    --forest-deep: #1f3a18;
    --ink: #1d2a20;
    --ink-soft: #485547;
    --muted: #7c857a;
    --line: #d3cdb8;
    --line-soft: #e8e2cc;
    --paper: #fbf7ea;
    --cream: #ece2c8;
    --sage: #d8e3c0;
    --earth: #b87348;
    --earth-soft: #d4a484;
    --clay: #c2613b;
    --amber: #d49644;
    --sun: #e3a83f;
    /* Map-only colors */
    --grass: #d8e3c0;
    --grass-2: #c8d6ad;
    --soil: #b87348;
    --ruler: #1f3a18;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .display { font-family: 'Newsreader', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  button { font-family: inherit; cursor: pointer; }
  /* hide scrollbars while keeping scroll */
  .scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="canvas.jsx"></script>
  <script type="text/babel" src="zone-details.jsx"></script>
  <script type="text/babel" src="wizard.jsx"></script>
  <script type="text/babel" src="preview.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
